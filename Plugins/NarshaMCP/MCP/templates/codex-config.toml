# NarshaMCP MCP Server Configuration for OpenAI Codex
# Generated by: Rust MCP installer
#
# v0.9.0: Rust MCP only. Python MCP removed. narshamcp.exe is the sole MCP server.
#
# This configuration enables NarshaMCP MCP tools in OpenAI Codex:
# - Policy tools (analysis/generation/fix/workflow)
# - Sequencer sub-tools (ue_sequencer_*)
# - Editor sub-tools (ue_editor_actors, ue_editor_assets, ue_editor_automation, ue_editor_debug)
# - Standalone tools (ue_run_workflow, ue_search_assets, ue_tool_docs, ue_engine_docs)
# - Hidden task tools (cancel_task, list_active_tasks, cancel_all_tasks, get_task_status, get_task_result, list_tasks)
#
# For more information:
# - NarshaMCP: https://github.com/Next-Stage-Inc/ue-code-mcp
# - Codex MCP Docs: https://developers.openai.com/codex/mcp/

[mcp_servers.narshamcp]
command = "{NARSHAMCP_EXE_PATH}"
args = ["connect", "--project-path", "{PROJECT_DIR}", "--engine-path", "{ENGINE_DIR}"]

# Timeout settings (seconds)
# UE tools may need longer timeouts for:
# - ue_generate_code: 30-60s for code generation
# - ue_editor_actors/ue_editor_assets/ue_editor_automation/ue_editor_debug: 120s for Editor roundtrip
# - ue_fix_errors: 30-60s for complex error resolution
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.narshamcp.env]
RUST_LOG = "error"
